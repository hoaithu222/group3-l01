<!doctype html>
<!--
  `class="dark"` = MÀU KHỞI TẠO của hệ thống, khai ở tầng HTML.

  Bắt buộc phải có: `ThemeProvider` chỉ gắn class này trong `useEffect`, tức là
  SAU khi React mount. Khung hình đầu tiên của mọi lần tải/F5 vì thế vẽ bằng
  token của `:root` (= light) rồi mới lật sang dark — đọc ra đúng như "vào trang
  bị nháy sáng". Khai sẵn ở đây thì trang tối ngay từ pixel đầu.

  Giữ ĐỒNG BỘ với `initialState.theme` ở `src/app/store/slices/theme/index.ts`.
  Người dùng chọn light thì `ThemeProvider` tự gỡ class ngay khi mount.
-->
<html lang="vi" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      `viewport-fit=cover` — BẮT BUỘC cho máy tính bảng ở chế độ PWA. Không có
      nó, WebKit tự chừa dải lề đen quanh vùng an toàn và biến
      `env(safe-area-inset-*)` thành 0 → không thể canh thanh neo đáy tránh vạch
      Home. Trên máy để bàn thuộc tính này KHÔNG có tác dụng gì.

      `maximum-scale` / `user-scalable` CỐ Ý KHÔNG khai: khoá phóng to là chặn
      luôn khả năng phóng của người cần trợ năng, và app dạng bảng số liệu dày
      thì phóng hai ngón là thao tác chính đáng.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Super App Admin — trang quản trị hệ thống Super App" />

    <!-- PWA: manifest cho trình duyệt chuẩn; cụm apple-* cho iPadOS < 16.4.
         `status-bar-style=default` = thanh trạng thái ĐỤC, nội dung bắt đầu
         ngay dưới nó. KHÔNG dùng `black-translucent` — kiểu đó cho nội dung
         chui xuống dưới thanh trạng thái, header mất một dải 20px. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#EEF3F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#04162A" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Super App Admin" />
    <!-- iOS tự biến số điện thoại trong text thành link xanh, phá màu chữ ô mã/số -->
    <meta name="format-detection" content="telephone=no" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <title>Super App Admin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
