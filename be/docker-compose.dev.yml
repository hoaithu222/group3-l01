version: "3.8"

# Docker Compose — DEVELOPMENT infrastructure only
# BE chạy qua `npm run dev` trên máy host, chỉ Redis chạy trong container.
# MongoDB Atlas là cloud — không có mongo service ở đây.
# Usage: docker compose -f be/docker-compose.dev.yml up -d

services:
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
