<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chào mừng!</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        margin: 0;
        padding: 0;
      }
      .container {
        max-width: 600px;
        margin: 40px auto;
        background: #fff;
        border-radius: 8px;
        padding: 40px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      h1 {
        color: #333;
      }
      p {
        color: #555;
        line-height: 1.6;
      }
      .btn {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 24px;
        background: #4f46e5;
        color: #fff;
        text-decoration: none;
        border-radius: 6px;
        font-weight: bold;
      }
      .footer {
        margin-top: 30px;
        font-size: 12px;
        color: #999;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🎉 Chào mừng bạn, {{name}}!</h1>
      <p>Cảm ơn bạn đã đăng ký tài khoản. Chúng tôi rất vui được chào đón bạn.</p>
      <p>Hãy đăng nhập để bắt đầu khám phá các tính năng của hệ thống.</p>
      <a href="#" class="btn">Đến trang chủ</a>
      <div class="footer">
        <p>Nếu bạn không đăng ký, vui lòng bỏ qua email này.</p>
      </div>
    </div>
  </body>
</html>
