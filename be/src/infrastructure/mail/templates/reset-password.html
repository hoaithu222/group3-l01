<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đặt lại mật khẩu</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        margin: 0;
        padding: 0;
      }
      .container {
        max-width: 600px;
        margin: 40px auto;
        background: #fff;
        border-radius: 8px;
        padding: 40px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      h1 {
        color: #333;
      }
      p {
        color: #555;
        line-height: 1.6;
      }
      .btn {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 24px;
        background: #dc2626;
        color: #fff;
        text-decoration: none;
        border-radius: 6px;
        font-weight: bold;
      }
      .token-box {
        background: #f1f5f9;
        padding: 12px 16px;
        border-radius: 6px;
        font-family: monospace;
        font-size: 14px;
        word-break: break-all;
        margin: 16px 0;
      }
      .footer {
        margin-top: 30px;
        font-size: 12px;
        color: #999;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🔐 Đặt lại mật khẩu</h1>
      <p>Chúng tôi nhận được yêu cầu đặt lại mật khẩu cho tài khoản của bạn.</p>
      <p>
        Nhấp vào nút bên dưới để đặt lại mật khẩu (link có hiệu lực trong <strong>15 phút</strong>):
      </p>
      <a href="{{url}}" class="btn">Đặt lại mật khẩu</a>
      <p style="margin-top: 20px">Hoặc dùng token sau:</p>
      <div class="token-box">{{token}}</div>
      <div class="footer">
        <p>Nếu bạn không yêu cầu, vui lòng bỏ qua email này. Mật khẩu sẽ không thay đổi.</p>
      </div>
    </div>
  </body>
</html>
