# ─────────────────────────────────────────────────────────────────────────────
# Site ADMIN SPA — TEMPLATE (envsubst: ${ADMIN_DOMAIN}).  production `admin.superapp.vcijsc.com`, staging `admin-staging.superapp.vcijsc.com`.
# SPA phục vụ bởi service `admin` (ảnh nginx:alpine + dist, deploy/admin/Dockerfile: try_files, cache asset hash 1 năm, index.html no-cache).
# `/api` + `/socket.io` proxy CÙNG ORIGIN để cookie HttpOnly refresh-token không bị coi là third-party (Safari chặn).
# ─────────────────────────────────────────────────────────────────────────────
server {
  listen 443 ssl;
  http2 on;
  server_name ${ADMIN_DOMAIN};

  ssl_certificate     /etc/letsencrypt/live/${ADMIN_DOMAIN}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/${ADMIN_DOMAIN}/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  include /etc/nginx/snippets/security-headers.conf;

  location = /metrics {
    deny all;
  }

  # Webhook KHÔNG đi qua domain admin (chỉ domain API) — chặn để bề mặt admin nhỏ nhất có thể.
  location /api/v1/webhooks/ {
    return 404;
  }

  location /api/ {
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_set_header Connection "";
    client_max_body_size 105m;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_pass http://api_http;
  }

  location /socket.io/ {
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_buffering off;
    proxy_pass http://api_socket;
  }

  # SPA (service `admin`). CSP (admin.md §2 / config-be.md §12):
  #  · connect-src: 'self' + WebSocket cùng host + Sentry (${ADMIN_DOMAIN} phải khớp origin SPA); thêm Mapbox khi bật bản đồ O2O (Phase 5).
  #  · style-src 'unsafe-inline' (Radix/kit2 dùng style inline) + Google Fonts (index.html tải Inter/JetBrains Mono/Noto Sans); font-src gstatic.
  #  · img-src https: (avatar/tệp từ S3/Cloudinary); worker-src blob: (Mapbox GL); frame-ancestors 'none'.
  location / {
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_set_header Connection "";
    proxy_pass http://admin:80;

    include /etc/nginx/snippets/security-headers.conf;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://api.mapbox.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' wss://${ADMIN_DOMAIN} https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://api.mapbox.com https://events.mapbox.com; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }
}
