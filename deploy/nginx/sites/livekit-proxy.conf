# ─────────────────────────────────────────────────────────────────────────────
# CHỈ staging ĐƠN-VM (docker-compose.staging.override.yml) — TEMPLATE (envsubst: ${LK_DOMAIN}).
# Proxy `wss://${LK_DOMAIN}` → LiveKit (network_mode: host) của CHÍNH VM này qua `host.docker.internal:7880`. Production/khuyến nghị: LiveKit ở VM RIÊNG với
# nginx "edge" của riêng nó (deploy/livekit/edge) — KHÔNG mount file này.
# LiveKit signal = WebSocket dài hạn → Upgrade + timeout 3600 s (p0-08 be.md §3.2).
# ─────────────────────────────────────────────────────────────────────────────
server {
  listen 443 ssl;
  http2 on;
  server_name ${LK_DOMAIN};

  ssl_certificate     /etc/letsencrypt/live/${LK_DOMAIN}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/${LK_DOMAIN}/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  include /etc/nginx/snippets/security-headers.conf;

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host       $host;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    proxy_pass http://host.docker.internal:7880;
  }
}
