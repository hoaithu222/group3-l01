# ─────────────────────────────────────────────────────────────────────────────
# Site API + socket + app links + trang công khai  —  TEMPLATE (envsubst: ${API_DOMAIN}, ${SWAGGER_AUTH_BASIC}).
# Domain (D-14): production `superapp.vcijsc.com`, staging `staging.superapp.vcijsc.com`.
# Chứng chỉ Let's Encrypt: /etc/letsencrypt/live/${API_DOMAIN}/ (scripts/issue-certs.sh).
# ─────────────────────────────────────────────────────────────────────────────
server {
  listen 443 ssl;
  http2 on;
  server_name ${API_DOMAIN};

  ssl_certificate     /etc/letsencrypt/live/${API_DOMAIN}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/${API_DOMAIN}/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  include /etc/nginx/snippets/security-headers.conf;

  # ── Universal Links (iOS) + App Links (Android) cho com.mancode.vungnui (D-14) ──
  # Apple: `application/json`, KHÔNG redirect, không có đuôi .json; Android: /.well-known/assetlinks.json. Nội dung render bởi scripts/render-config.sh
  # (AASA phủ đúng các pathPrefix của app.config.ts: /invite /m /w /c /s /live /mentor).
  location = /.well-known/apple-app-site-association {
    default_type application/json;
    alias /srv/well-known/apple-app-site-association;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=3600" always;
  }
  location = /.well-known/assetlinks.json {
    default_type application/json;
    alias /srv/well-known/assetlinks.json;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=3600" always;
  }

  # ── Webhook nhà cung cấp (LiveKit JWT ký sha256(body), GitHub HMAC, …): RAW body, KHÔNG sửa/đệm — chữ ký tính trên đúng chuỗi byte gốc (OPS-09) ──
  # BE nhận tối đa 256 kB (`express.raw`); 1m ở đây là trần nginx. Không gzip/sub_filter/rewrite body ở location này.
  location /api/v1/webhooks/ {
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    client_max_body_size 1m;
    proxy_read_timeout 30s;
    proxy_pass http://api_http;
  }

  # ── Swagger (staging: bảo vệ basic auth; production: SWAGGER_ENABLED=false nên API tự trả 404, SWAGGER_AUTH_BASIC=off) ──
  location ^~ /api/docs {
    auth_basic "${SWAGGER_AUTH_BASIC}";
    auth_basic_user_file /etc/nginx/secrets/swagger.htpasswd;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_set_header Connection "";
    proxy_pass http://api_http;
  }

  # ── REST API ──
  # client_max_body_size ≥ MAX_FILE_SIZE của BE (mặc định 100mb — upload qua PUT /assets/:id/content khi không dùng presigned S3). Tăng đồng bộ nếu BE tăng.
  location /api/ {
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_set_header Connection "";
    client_max_body_size 105m;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_pass http://api_http;
  }

  # Tệp cục bộ (STORAGE_TYPE=local — chỉ dev/staging nhỏ; production dùng S3 + URL ký).
  location /uploads/ {
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_set_header Connection "";
    proxy_pass http://api_http;
  }

  # ── Socket.IO: nâng cấp WebSocket + `ip_hash` (dính theo IP; xem nginx.conf) ──
  location /socket.io/ {
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_buffering off;
    proxy_pass http://api_socket;
  }

  # /metrics của API KHÔNG công khai — Prometheus scrape NỘI BỘ (api-1:3000/metrics, Bearer METRICS_TOKEN).
  location = /metrics {
    deny all;
  }

  # ── Trang portfolio công khai `/p/:slug` (p6-07 be.md §9) — cache 5 phút (200/301), 404 chỉ 1 phút; bỏ Set-Cookie để đệm được; cache_lock chống dồn tải ──
  # Unpublish ≤ 5 phút vì nginx OSS không purge từng khoá (README p6-07 §2). Chỉ GET/HEAD; khoá cache theo host + URI (KHÔNG theo cookie/Authorization).
  location /p/ {
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_set_header Connection "";
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_cache portfolio;
    proxy_cache_key "$scheme$host$request_uri";
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 301 5m;
    proxy_cache_valid 404 1m;
    proxy_ignore_headers Set-Cookie;
    proxy_hide_header Set-Cookie;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout http_502 http_503 http_504 updating;
    include /etc/nginx/snippets/security-headers.conf;
    add_header X-Cache-Status $upstream_cache_status always;
    proxy_pass http://api_http;
  }

  # ── Collab (Hocuspocus/Yjs — p6-01, package `collab/`) ──
  # GIẢ ĐỊNH theo plan p6-01: service `collab` cổng 4000, gốc `/`, client nối `wss://<domain>/collab`. Phân giải DNS LÚC CHẠY (resolver Docker + biến) để nginx vẫn khởi động
  # khi profile `collab` chưa bật (khi đó chỉ đường /collab trả 502). Một instance nên không cần `hash $arg_doc consistent`; nhiều instance → chuyển sang `upstream` có hash.
  location ~ ^/collab(/|$) {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $collab_upstream http://collab:4000;
    rewrite ^/collab/?(.*)$ /$1 break;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    proxy_pass $collab_upstream;
  }

  # ── Người chưa cài app mở link mời/họp/tin nhắn: trang tĩnh tối thiểu (P1: trang "Mở trong app / Tải app" đầy đủ). Có app thì HĐH chặn link trước khi tới đây. ──
  location ~ ^/(invite|m|w|c|s|live|mentor)/ {
    root /srv/static;
    rewrite ^ /open.html break;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
  }

  location / {
    return 404;
  }
}
