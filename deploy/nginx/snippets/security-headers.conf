# Tiêu đề bảo mật chung (p0-11). ⚠️ `add_header` trong một `location` GHI ĐÈ (không cộng dồn) add_header cấp server —
# location nào tự khai add_header (Cache-Control, CSP, X-Cache-Status…) phải `include` lại file này.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
