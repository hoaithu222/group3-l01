# Tiêu đề proxy chung tới upstream BE (p0-11). API đặt `trust proxy = 1` nên tin ĐÚNG MỘT bước X-Forwarded-For do nginx thêm.
# Location thường thêm  proxy_set_header Connection "";  (keepalive upstream); location WebSocket thêm Upgrade/Connection ($connection_upgrade).
# Phía trước nginx có CDN/LB (Cloudflare, ALB…) thì thêm `set_real_ip_from`/`real_ip_header` ở nginx.conf để $remote_addr là IP người dùng thật.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID      $req_id;
