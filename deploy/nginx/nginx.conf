# ─────────────────────────────────────────────────────────────────────────────
# nginx chính (p0-11) — mount vào /etc/nginx/nginx.conf. Các site (`sites/*.conf`) là TEMPLATE: ảnh nginx chính thức tự envsubst
# `/etc/nginx/templates/*.template` → `/etc/nginx/sites/*.conf` (compose đặt NGINX_ENVSUBST_OUTPUT_DIR + bộ lọc chỉ thay *_DOMAIN/*_AUTH_BASIC).
# ─────────────────────────────────────────────────────────────────────────────
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections  4096;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Kết nối WebSocket: Upgrade/Connection theo header của client.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # X-Request-ID: giữ giá trị của client (app có thể tự đặt) nếu có, không thì dùng $request_id của nginx — BE (`requestIdMiddleware`) dùng lại đúng giá trị này.
  map $http_x_request_id $req_id {
    default $http_x_request_id;
    ''      $request_id;
  }

  # Log dạng JSON một dòng — Promtail thu từ stdout Docker (không ghi file trong container).
  log_format json_combined escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","request_id":"$req_id","host":"$host","method":"$request_method",'
    '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,"upstream":"$upstream_addr",'
    '"upstream_status":"$upstream_status","upstream_time":"$upstream_response_time","cache":"$upstream_cache_status",'
    '"referer":"$http_referer","ua":"$http_user_agent"}';
  # ⛔ KHÔNG log query string ($request_uri) — có thể mang token/từ khoá tìm kiếm riêng tư (conventions §7.9); $uri không có query.
  access_log  /dev/stdout  json_combined;

  sendfile        on;
  tcp_nopush      on;
  keepalive_timeout  65;
  server_tokens   off;
  gzip            on;
  gzip_types      application/json text/css application/javascript image/svg+xml;
  gzip_min_length 1024;

  # ── Upstream (tên service cố định của compose; nginx phân giải LÚC KHỞI ĐỘNG/RELOAD — `scripts/rolling.sh` reload sau khi mỗi replica lên lại) ──
  upstream api_http {
    least_conn;
    server api-1:3000 max_fails=2 fail_timeout=10s;
    server api-2:3000 max_fails=2 fail_timeout=10s;
    keepalive 32;
  }
  # Socket.IO: `ip_hash` (dính theo IP) vì polling fallback cần cùng replica cho cả phiên; app đã websocket-only, admin còn polling.
  # ⚠️ Nhiều người sau NAT chung IP sẽ dồn về một replica — P1: sticky cookie hoặc admin websocket-only (README §Rủi ro).
  upstream api_socket {
    ip_hash;
    server api-1:3000 max_fails=2 fail_timeout=10s;
    server api-2:3000 max_fails=2 fail_timeout=10s;
  }

  # Bộ nhớ đệm trang portfolio công khai (p6-07 be.md §9): 10 MB khoá, tối đa 1 GB, bỏ sau 1 giờ không dùng.
  proxy_cache_path /var/cache/nginx/portfolio levels=1:2 keys_zone=portfolio:10m max_size=1g inactive=1h use_temp_path=off;

  # HTTP :80 — health cho Docker, HTTP-01 của certbot, còn lại chuyển sang HTTPS (KHÔNG áp cho AASA: Apple chỉ lấy qua HTTPS, không redirect).
  server {
    listen 80 default_server;
    server_name _;

    location = /nginx-health {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }
    location / {
      return 301 https://$host$request_uri;
    }
  }

  include /etc/nginx/sites/*.conf;
}
