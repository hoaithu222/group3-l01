# Loki đơn-nhị phân, lưu file cục bộ (p0-11): đủ cho một VM. Điểm mở (README): tự host Loki hay CloudWatch — phụ thuộc nơi đặt VM; mặc định Loki cùng compose observability.
# Log của app đã là JSON một dòng trên stdout (LOG_STDOUT=true), KHÔNG có body/token (logger redact + conventions §7.9).
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-04-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 336h # 14 ngày
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  max_query_lookback: 336h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
