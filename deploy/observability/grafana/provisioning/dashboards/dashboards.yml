apiVersion: 1
providers:
  - name: superapp
    orgId: 1
    folder: Super App
    type: file
    disableDeletion: true
    allowUiUpdates: false # sửa dashboard = sửa JSON trong deploy/observability/grafana/dashboards rồi PR
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
