# nginx BÊN TRONG ảnh admin (p0-11 admin.md): SPA + cache. Edge nginx (deploy/nginx/sites/admin.conf) lo TLS, CSP, /api, /socket.io và proxy `/` về đây.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
  gzip_min_length 1024;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Asset băm nội dung (Vite `assets/<tên>-<hash>.js|css`, font, ảnh) → cache 1 năm, immutable.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # index.html + manifest + service worker (nếu có) KHÔNG cache — đổi bản là người dùng thấy ngay (asset băm hash nên an toàn).
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache" always;
  }

  # SPA fallback: mọi đường dẫn không phải tệp → index.html (React Router). `add_header` ở location cha không kế thừa → khai lại.
  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }
}
