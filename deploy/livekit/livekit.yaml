# ─────────────────────────────────────────────────────────────────────────────
# livekit.yaml — TEMPLATE (p0-08 be.md §3.1). KHÔNG mount trực tiếp: `bash ../scripts/render-config.sh livekit` envsubst → rendered/livekit.yaml (chmod 600, gitignore).
# Biến (deploy/livekit/.env): LIVEKIT_API_KEY, LIVEKIT_API_SECRET, LK_REDIS_PORT, LK_REDIS_PASSWORD, TURN_DOMAIN, API_DOMAIN.
# ⛔ Khoá KHÁC nhau mỗi môi trường (D-24); rendered/ chứa bí mật — không commit, không dán vào chat/ticket.
# ─────────────────────────────────────────────────────────────────────────────
port: 7880
bind_addresses: [""]
rtc:
  tcp_port: 7881 # ICE/TCP (fallback khi UDP bị chặn)
  port_range_start: 50000 # media UDP
  port_range_end: 60000
  use_external_ip: true # VM sau NAT của cloud: LiveKit tự dò IP công khai qua STUN
redis:
  address: 127.0.0.1:${LK_REDIS_PORT}
  password: ${LK_REDIS_PASSWORD}
keys:
  ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
turn:
  enabled: true
  domain: ${TURN_DOMAIN} # PHẢI khớp chứng chỉ TLS của edge (turn.<domain>)
  udp_port: 3478 # TURN/UDP
  tls_port: 5349 # cổng NỘI BỘ — edge nginx kết thúc TLS ở :443 rồi chuyển TURN thuần tới đây
  external_tls: true # TLS do edge kết thúc; LiveKit quảng bá `turns:<TURN_DOMAIN>:443` cho client
webhook:
  api_key: ${LIVEKIT_API_KEY} # khoá ký webhook — CÙNG cặp với BE (LIVEKIT_API_KEY/SECRET)
  urls:
    - https://${API_DOMAIN}/api/v1/webhooks/livekit
room:
  empty_timeout: 30 # giây phòng trống tự đóng (BE vẫn tự kết thúc theo nghiệp vụ)
  departure_timeout: 20
  max_participants: 50 # trần kỹ thuật; trần nghiệp vụ theo LIMITS.call/meeting
prometheus_port: 6789 # Prometheus scrape (observability/targets/livekit.example.yml) — firewall CHỈ cho VM giám sát
logging:
  level: info
  json: true
