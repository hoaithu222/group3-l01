# nginx "edge" của VM LiveKit (p0-08/p0-11). Cấu hình cụ thể nằm ở templates/ (envsubst → /etc/nginx/rendered/{stream,http}/*.conf).
# Cần module stream + ssl_preread (ảnh nginx chính thức đã bật sẵn).
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections  4096;
}

stream {
  include /etc/nginx/rendered/stream/*.conf;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  access_log    /dev/stdout;
  server_tokens off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  include /etc/nginx/rendered/http/*.conf;
}
